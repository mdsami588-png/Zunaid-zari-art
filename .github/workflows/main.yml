name: Build Zunaid Zari Art APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          unzip -o "Zunaid_Zari_Art_Cloud_Build_Project (1) (1).zip" -d project
          cd "project/Zunaid_Zari_Art_Cloud_Build_Project (1)"
          gradle assembledebug 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zunaid-Zari-Art-APK
          path: project/**/build/outputs/apk/**/*.apk
